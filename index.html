<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172c46"><meta name="description" content="Prosty kalkulator procentowego skalowania wymiarów modeli 3D"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>ScaleCalc 3D</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#0d1827;color:#f5f7fc;display:grid;place-items:center;padding:20px}.app{width:min(100%,420px);background:#172c46;border:1px solid #38506b;border-radius:24px;padding:26px;box-shadow:0 15px 45px #0005}.lang{display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px}.lang button{width:auto;margin:0;padding:8px 12px;background:#314e6c;color:white}.lang button[aria-pressed="true"]{background:#64b5ff;color:#061b2e}h1{font-size:1.6rem;margin:0 0 8px}p{color:#afc2d8;margin:0 0 26px}label{display:block;font-weight:600;margin:18px 0 8px}input{width:100%;border:1px solid #66809c;border-radius:12px;padding:15px;font:inherit;font-size:1.3rem;background:#0c1c30;color:white}input:focus{outline:2px solid #6eb5ff}.result{background:#0b2037;border-radius:16px;padding:24px;margin-top:28px;text-align:center}.small{font-size:.95rem;color:#b5c9df}.percent{font-size:3.3rem;font-weight:800;margin:10px 0;color:#7dc5ff;overflow-wrap:anywhere}.detail{font-size:1.1rem}button{border:0;background:#64b5ff;color:#061b2e;border-radius:12px;font:inherit;font-weight:700;padding:15px;width:100%;margin-top:18px}button:disabled{opacity:.5}.note{margin-top:16px;font-size:.8rem;text-align:center;color:#adc2d9}</style></head><body><main class="app"><div class="lang"><button type="button" id="pl" aria-pressed="true">PL</button><button type="button" id="en" aria-pressed="false">EN</button></div><h1>📐 ScaleCalc 3D</h1><p id="subtitle">Przelicz wymiary na procent skalowania</p><label id="labelOriginal" for="original">Wymiar oryginalny (mm)</label><input id="original" inputmode="decimal" type="text" value="20" autocomplete="off"><label id="labelTarget" for="target">Wymiar docelowy (mm)</label><input id="target" inputmode="decimal" type="text" value="27" autocomplete="off"><section class="result" aria-live="polite"><div class="small" id="resultLabel">Ustaw skalowanie na</div><div class="percent" id="percent">135%</div><div class="detail" id="detail">Powiększenie o 35%</div></section><button id="copy">Kopiuj wynik</button><div class="note" id="note">100% = wymiar bez zmian</div></main><script>
const a=document.querySelector('#original'),b=document.querySelector('#target'),out=document.querySelector('#percent'),detail=document.querySelector('#detail'),copy=document.querySelector('#copy');
const tr={pl:{subtitle:'Przelicz wymiary na procent skalowania',original:'Wymiar oryginalny (mm)',target:'Wymiar docelowy (mm)',result:'Ustaw skalowanie na',copy:'Kopiuj wynik',copied:'Skopiowano!',copyError:'Zaznacz wynik, aby skopiować',note:'100% = wymiar bez zmian',invalid:'Podaj dodatnie wymiary',up:'Powiększenie o ',down:'Pomniejszenie o ',same:'Bez zmiany wymiaru'},en:{subtitle:'Convert dimensions into a scaling percentage',original:'Original size (mm)',target:'Target size (mm)',result:'Set scale to',copy:'Copy result',copied:'Copied!',copyError:'Select the result to copy',note:'100% = no size change',invalid:'Enter positive dimensions',up:'Increase by ',down:'Decrease by ',same:'No size change'}};
let lang='pl';try{lang=localStorage.getItem('scalecalc-lang')==='en'?'en':'pl'}catch(e){}
const parse=v=>Number(v.trim().replace(',','.'));const fmt=n=>new Intl.NumberFormat(lang==='pl'?'pl-PL':'en-US',{maximumFractionDigits:2}).format(n);
function calc(){const x=parse(a.value),y=parse(b.value),t=tr[lang];if(!a.value.trim()||!b.value.trim()||!Number.isFinite(x)||!Number.isFinite(y)||x<=0||y<=0){out.textContent='—';detail.textContent=t.invalid;copy.disabled=true;return}const pct=y/x*100;out.textContent=fmt(pct)+'%';detail.textContent=pct>100?t.up+fmt(pct-100)+'%':pct<100?t.down+fmt(100-pct)+'%':t.same;copy.disabled=false;try{localStorage.setItem('scalecalc-values',JSON.stringify([a.value,b.value]))}catch(e){}}
function setLang(v){lang=v;document.documentElement.lang=v;const t=tr[v];for(const [id,key] of [['subtitle','subtitle'],['labelOriginal','original'],['labelTarget','target'],['resultLabel','result'],['note','note']])document.getElementById(id).textContent=t[key];copy.textContent=t.copy;document.getElementById('pl').setAttribute('aria-pressed',String(v==='pl'));document.getElementById('en').setAttribute('aria-pressed',String(v==='en'));try{localStorage.setItem('scalecalc-lang',v)}catch(e){}calc()}
try{const saved=JSON.parse(localStorage.getItem('scalecalc-values')||localStorage.getItem('scale3d'));if(Array.isArray(saved)&&saved.length===2){a.value=saved[0];b.value=saved[1]}}catch(e){}
a.addEventListener('input',calc);b.addEventListener('input',calc);document.getElementById('pl').addEventListener('click',()=>setLang('pl'));document.getElementById('en').addEventListener('click',()=>setLang('en'));
copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(out.textContent);copy.textContent=tr[lang].copied;setTimeout(()=>copy.textContent=tr[lang].copy,1500)}catch(e){copy.textContent=tr[lang].copyError}});
setLang(lang);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
